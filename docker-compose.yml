services:
  app:
    build: .
    image: interview-review
    container_name: interview-review
    restart: unless-stopped
    # 8000 不再对宿主机暴露，只走 compose 内部网络给 nginx。
    # 服务器上临时调试 API 用：docker compose exec app python -c "..."
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # 容器内固定路径；DATA_DIR 在 .env 里的值会被这里覆盖
      DATA_DIR: /data
      STATIC_DIR: /app/static
    volumes:
      # SQLite 数据库和上传的音频都在这里。备份 = 备份这个目录。
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: interview-review-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 上 HTTPS 时取消注释，并把证书放到服务器 ./nginx/certs/ 下
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
