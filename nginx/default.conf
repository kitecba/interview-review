# 面试复盘助手 · Nginx 反向代理
#
# 挂载到 nginx 容器的 /etc/nginx/conf.d/default.conf。
# 上游 app:8000 是 compose 网络里的 FastAPI 容器（docker DNS 解析）。

server {
    listen 80;
    server_name _;

    # 面试录音单个文件可到几百 MB（后端上限 500MB），Nginx 默认 1MB 会导致
    # 上传直接 413 —— 这是加 Nginx 最重要的原因
    client_max_body_size 500m;

    # 大文件上传可能持续几分钟，各段超时都要放宽
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # 前端产物(JS/CSS)有 300KB 级，gzip 值得开
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缓冲关掉：上传大文件时边收边转发，不在磁盘上落临时文件
        proxy_request_buffering off;
    }

    # ------------------------------------------------------------------
    # HTTPS（要上的时候）：
    # 1. 域名解析到服务器，证书放到服务器 ./nginx/certs/ 下
    # 2. docker-compose.yml 里取消 certs 挂载的注释，重启
    # 3. 取消本块注释，server_name 改成你的域名，并在 80 块里加一行
    #    return 301 https://$host$request_uri;  强制跳转
    # ------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     client_max_body_size 500m;
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout    600s;
    #     proxy_read_timeout    600s;
    #
    #     location / {
    #         proxy_pass http://app:8000;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_request_buffering off;
    #     }
    # }
}
